<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty of Science - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
        }

        .header { 
            background-color: #002266; 
            color: white; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .header-logo-text .thai { font-size: 14px; font-weight: 300; display: block; }
        .header-logo-text .eng { font-size: 22px; font-weight: 500; margin-top: -2px; }

        .hamburger { font-size: 24px; cursor: pointer; }

        .container { 
            max-width: 900px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        .btn-group { display: flex; gap: 10px; }
        
        /* ตกแต่งปุ่มให้กดได้เหมือนเดิม */
        .btn { 
            background-color: #002266; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 14px;
            font-family: 'Prompt', sans-serif;
            transition: opacity 0.2s;
            display: inline-block;
            text-decoration: none; /* ลบเส้นใต้ลิงก์ */
        }
        .btn:hover { opacity: 0.9; }

        .title-text { 
            font-size: 22px; 
            font-weight: 500; 
            color: #333; 
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 40px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 25px;
        }

        .section-title { 
            display: flex; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .yellow-marker { 
            width: 5px; 
            height: 24px; 
            background-color: #ffcc00; 
            margin-right: 12px; 
        }

        .section-label { 
            font-size: 18px; 
            font-weight: 600; 
            color: #333; 
        }

        .info-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
            margin-left: 17px; 
        }

        .info-group label { 
            font-size: 14px; 
            font-weight: 500; 
            color: #555; 
            margin-bottom: 8px;
            display: block;
        }

        .info-group p { 
            font-size: 16px; 
            color: #333; 
        }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; }
            .top-bar { flex-direction: column-reverse; align-items: flex-start; gap: 20px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-logo-text">
            <span class="thai">คณะวิทยาศาสตร์</span>
            <span class="eng">Faculty of Science</span>
        </div>
        <div class="hamburger">≡</div>
    </header>

    <main class="container">
        
        <div class="top-bar">
            <div class="btn-group">
                <a href="room_01.html" class="btn">แก้ไขข้อมูล</a>
                <a href="room_01.html" class="btn">เพิ่มข้อมูล</a>
            </div>
            <div class="title-text">ข้อมูลสถานที่และอุปกรณ์</div>
        </div>

        <div class="card">
            <div class="section-title">
                <div class="yellow-marker"></div>
                <div class="section-label">สถานที่</div>
            </div>
            <div class="info-grid">
                <div class="info-group">
                    <label>เลขห้อง</label>
                    <p>SC 999</p>
                </div>
                <div class="info-group">
                    <label>ช่องทางการติดต่อผู้รับผิดชอบ</label>
                    <p>090-000-0000</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">
                <div class="yellow-marker"></div>
                <div class="section-label">อุปกรณ์</div>
            </div>
            <div class="info-grid">
                <div class="info-group">
                    <label>ประเภทอุปกรณ์</label>
                    <p>โปรเจคเตอร์</p>
                </div>
                <div class="info-group">
                    <label>ช่องทางการติดต่อขอยืมอุปกรณ์</label>
                    <p>090-000-0000</p>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
